<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - MatchAlert</title>
  <link rel="stylesheet" href="registro.css">
</head>
<body>

<section>
  <h1>Crear Cuenta en MatchAlert</h1>

  <form action="../pagina-login/login.html" method="POST">

    <div>
      <label for="email">Correo Electrónico</label>
      <input type="email" id="email" placeholder="tu@correo.com" required>
      <small id="emailError" class="error"></small>
    </div>

    <div>
      <label for="password">Contraseña</label>
      <input type="password" id="password" required>
      <small id="passwordError" class="error"></small>
    </div>

    <div>
      <label for="confirmPassword">Confirmar contraseña</label>
      <input type="password" id="confirmPassword" required>
      <small id="confirmError" class="error"></small>
    </div>

    <div class="options">
      <label>
        <input type="checkbox" required>
        Acepto los términos y condiciones
      </label>
    </div>

    <button type="submit">Registrarse</button>

  </form>

  <p>¿Ya tienes una cuenta?
    <a href="../../pages/pagina-login/login.html" style="text-decoration: none;">Inicia sesión</a>
  </p>

</section>

<script src="registro.js"></script>
</body>
</html>
