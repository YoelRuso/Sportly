<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario - Sportly</title>

  <link rel="stylesheet" href="../../../public/style.css">
  <link rel="stylesheet" href="calendario.css">
</head>
<body style="background-color: #0f0f0f;">

<!-- Header inyectado por app.js → renderComponent(..., 'header') -->
<div id="header"></div>

<main class="calendar-wrapper">
  <header class="calendar-header-section">
    <h1 class="calendar-title">Calendario de Eventos</h1>

    <nav class="center-items-row">
      <ul class="nav-selectionar-tiempo">
        <li><a href="#" class="nav-arrow" id="prev-month">&lt;</a></li>
        <li class="time-display" id="month-display">Febrero</li>
        <li><a href="#" class="nav-arrow" id="next-month">&gt;</a></li>
      </ul>
      <ul class="nav-selectionar-tiempo">
        <li><a href="#" class="nav-arrow" id="prev-year">&lt;</a></li>
        <li class="time-display" id="year-display">2026</li>
        <li><a href="#" class="nav-arrow" id="next-year">&gt;</a></li>
      </ul>
    </nav>
  </header>

  <table id="calendar">
    <thead>
    <tr>
      <th>Lun</th>
      <th>Mar</th>
      <th>Mié</th>
      <th>Jue</th>
      <th>Vie</th>
      <th>Sáb</th>
      <th>Dom</th>
    </tr>
    </thead>
    <tbody>
    </tbody>
  </table>

  <!-- Modal Pop-up para eventos -->
  <div id="events-modal" class="modal-overlay">
    <div class="modal-container">
      <button class="modal-close" id="close-modal">&times;</button>
      <h2 class="modal-title" id="modal-date"></h2>
      <div class="modal-events" id="modal-events-list"></div>
    </div>
  </div>

  <div id="info" class="calendar-info-box"></div>
</main>

<!-- Footer inyectado por app.js → renderComponent(..., 'footer') -->
<div id="footer"></div>

<script src="../../app.js"></script>
<script src="calendario.js"></script>
<script>
  initCalendario().then(async () => {
    await cargarEventos();
    generarCalendario();
    setupNavegacion();
    setupModal();
  });
</script>
</body>
</html>
