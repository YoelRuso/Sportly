<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Perfil de Usuario</title>
  <link rel="stylesheet" href="gestion-usuario.css" />
</head>
<body>
  <div class="dashboard">
    <!-- PANEL IZQUIERDO -->
    <div class="profile-section">
      <div class="profile-image">
        <img
          src="https://via.placeholder.com/150"
          alt="Foto de perfil"
        />
      </div>

      <button class="change-photo">Cambiar Foto</button>

      <div class="user-info">
        <p><strong>Email:</strong> <span id="email">usuario@gmail.com</span></p>
        <p><strong>ID:</strong> <span id="userID">#002</span></p>
      </div>
    </div>

    <!-- PANEL DERECHO -->
    <div class="favorites-section">
      <h2>Partidos Favoritos</h2>

      <div class="match-list" id="match-list">
        <!-- f.ex.<div class="match-item">
          <span>Real Madrid vs FC Barcelona</span>
          <span class="date">15 Marzo 2026 |  22:00 | en DAZN</span>
        </div>-->
      </div>
    </div>
  </div>
  <script src="gestion-usuario.js"></script>
  <script>
    initUsuario();
  </script>

</body>
</html>
